<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GacUI — Complete Control Showcase</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="./demo.css">
    <script type="module" src="./demo.js"></script>
</head>
<body>
    <header><a href="/index.html">Gaclib</a><span>Complete Control Showcase</span></header>
    <div id="gacui-loading" role="status">
        <label for="gacui-progress" id="gacui-loading-message">Preparing the demo…</label>
        <progress id="gacui-progress"></progress>
    </div>
    <div id="gacui-screen" class="gacui-container" tabindex="0" aria-label="GacUI control showcase"></div>
    <div class="actions">
        <button id="gacui-exit" disabled>Exit</button>
        <button id="gacui-force-exit" disabled>Force Exit</button>
    </div>
    <div id="gacui-error-mask" class="gacui-error-mask" role="alert">
        <div class="gacui-error-cross"></div>
        <div id="gacui-error-message" class="gacui-mask-message"></div>
    </div>
    <div id="gacui-success-mask" class="gacui-success-mask" role="status">
        <div class="gacui-success-tick"></div>
        <div id="gacui-success-message" class="gacui-mask-message"></div>
    </div>
</body>
</html>
