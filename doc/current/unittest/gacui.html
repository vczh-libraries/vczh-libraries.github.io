<script lang="javascript">
{
  const mvcModel = {

  ]
};
  const mvcViews = [
  {
    "targetObject": "MVC-ViewContainer",
    "viewName": "Gaclib-RootView"
  },
  {
    "targetObject": "rootViewContainer",
    "viewName": "Gaclib-DirectoryView"
  },
  {
    "targetObject": "directoryViewContainer",
    "viewName": "Gaclib-ArticleView"
  }
];
  const hrefPrefix = "/doc/current";
  const directoryInfo = {
  "subNodes": [
    {
      "icon": "-",
      "name": "Unit Testing",
      "selected": false,
      "path": [
        "unittest",
        "home"
      ],
      "subNodes": [
        {
          "icon": " ",
          "name": "Using Unit Test Framework",
          "selected": false,
          "path": [
            "unittest",
            "vlpp"
          ]
        },
        {
          "icon": "-",
          "name": "Running GacUI in Unit Test Framework",
          "selected": true,
          "path": [
            "unittest",
            "gacui"
          ],
          "subNodes": [
            {
              "icon": " ",
              "name": "Snapshots and Frames",
              "selected": false,
              "path": [
                "unittest",
                "gacui_frame"
              ]
            },
            {
              "icon": " ",
              "name": "IO Interaction",
              "selected": false,
              "path": [
                "unittest",
                "gacui_io"
              ]
            },
            {
              "icon": " ",
              "name": "Accessing Controls",
              "selected": false,
              "path": [
                "unittest",
                "gacui_controls"
              ]
            },
            {
              "icon": " ",
              "name": "Snapshot Viewer",
              "selected": false,
              "path": [
                "unittest",
                "gacui_snapshots"
              ]
            }
          ]
        }
      ]
    }
  ]
};
  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "Running GacUI in Unit Test Framework",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            The most simple way to start the unit test framework would be:\n            "
          },
          {
            "kind": "Program",
            "code": "#include <GacUI.UnitTest.h>\nusing namespace vl;\nusing namespace vl::unittest;\nusing namespace vl::presentation::unittest;\n\n#ifdef VCZH_MSVC\nint wmain(int argc , wchar_t* argv[])\n#else\nint main(int argc, char** argv)\n#endif\n{\n    UnitTestFrameworkConfig config;\n    config.snapshotFolder = L\"...\";\n    config.resourceFolder = L\"...\";\n    GacUIUnitTest_Initialize(&config);\n    int result = unittest::UnitTest::RunAndDisposeTests(argc, argv);\n    GacUIUnitTest_Finalize();\n#ifdef VCZH_CHECK_MEMORY_LEAKS\n    _CrtDumpMemoryLeaks();\n#endif\n    return result;\n}",
            "language": "c++"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            A typical test file would be:\n            "
          },
          {
            "kind": "Program",
            "code": "#include <GacUI.UnitTest.h>\nusing namespace vl;\nusing namespace vl::presentation;\nusing namespace vl::presentation::controls;\nusing namespace vl::presentation::unittest;\n\nTEST_FILE\n{\n    const auto resourceSingleButton = LR\"GacUISrc(\n<Resource>\n  <Instance name=\"MainWindowResource\">\n    <Instance ref.Class=\"gacuisrc_unittest::MainWindow\">\n      <Window ref.Name=\"self\" Text=\"GuiButton\" ClientSize=\"x:320 y:240\">\n        <Button ref.Name=\"button\" Text=\"This is a Button\">\n          <ev.Clicked-eval>...</ev.Clicked-eval>\n        </Button>\n      </Window>\n    </Instance>\n  </Instance>\n</Resource>\n)GacUISrc\";\n\n    TEST_CASE(L\"ClickOnMouseUp\")\n    {\n        GacUIUnitTest_SetGuiMainProxy([](UnitTestRemoteProtocol* protocol, IUnitTestContext*)\n        {\n            protocol->OnNextIdleFrame(L\"Ready\", [=]()\n            {\n                auto window = GetApplication()->GetMainWindow();\n                auto button = FindObjectByName<GuiButton>(window, L\"button\");\n                auto location = protocol->LocationOf(button);\n                protocol->LClick(location);\n            });\n            protocol->OnNextIdleFrame(L\"Close\", [=]()\n            {\n                auto window = GetApplication()->GetMainWindow();\n                window->Hide();\n            });\n        });\n        GacUIUnitTest_StartFast_WithResourceAsText<darkskin::Theme>(\n            WString::Unmanaged(L\"Controls/Basic/GuiButton/ClickOnMouseUp\"),\n            WString::Unmanaged(L\"gacuisrc_unittest::MainWindow\"),\n            resourceSingleButton\n            );\n    });\n}",
            "language": "c++"
          },
          {
            "kind": "Text",
            "text": "\n            Or if you are loading an existing window instead of making one from GacUI XML resource:\n            "
          },
          {
            "kind": "Program",
            "code": "#include <GacUI.UnitTest.h>\nusing namespace vl;\nusing namespace vl::presentation;\nusing namespace vl::presentation::controls;\nusing namespace vl::presentation::unittest;\n\nTEST_FILE\n{\n    TEST_CASE(L\"ClickOnMouseUp\")\n    {\n        GacUIUnitTest_SetGuiMainProxy([](UnitTestRemoteProtocol* protocol, IUnitTestContext*)\n        {\n            protocol->OnNextIdleFrame(L\"Ready\", [=]()\n            {\n                auto window = GetApplication()->GetMainWindow();\n                auto button = FindObjectByName<GuiButton>(window, L\"button\");\n                auto location = protocol->LocationOf(button);\n                protocol->LClick(location);\n            });\n            protocol->OnNextIdleFrame(L\"Close\", [=]()\n            {\n                auto window = GetApplication()->GetMainWindow();\n                window->Hide();\n            });\n        });\n        GacUIUnitTest_LinkGuiMainProxy([=](\n            vl::presentation::unittest::UnitTestRemoteProtocol* protocol,\n            vl::presentation::unittest::IUnitTestContext* context,\n            const vl::presentation::unittest::UnitTestMainFunc& previousMainProxy\n            )\n        {\n            {\n                vl::presentation::remoteprotocol::ControllerGlobalConfig globalConfig;\n#if defined VCZH_WCHAR_UTF16\n                globalConfig.documentCaretFromEncoding = vl::presentation::remoteprotocol::CharacterEncoding::UTF16;\n#elif defined VCZH_WCHAR_UTF32\n                globalConfig.documentCaretFromEncoding = vl::presentation::remoteprotocol::CharacterEncoding::UTF32;\n#endif\n                protocol->GetEvents()->OnControllerConnect(globalConfig);\n            }\n            auto theme = vl::Ptr(darkskin::Theme);\n            vl::presentation::theme::RegisterTheme(theme);\n            {\n                gacuisrc_unittest::MainWindow window;\n                window.MoveToScreenCenter();\n                previousMainProxy(protocol, context);\n                vl::presentation::controls::GetApplication()->Run(&window);\n            }\n            vl::presentation::theme::UnregisterTheme(theme->Name);\n        });\n        GacUIUnitTest_Start(WString::Unmanaged(L\"Controls/Basic/GuiButton/ClickOnMouseUp\"));\n    });\n});",
            "language": "c++"
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "About Snapshots and Frames",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                This test case will create a bunch of file in "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "UnitTestFrameworkConfig::snapshotFolder"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ",\n                under the path "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Controls/Basic/GuiButton"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                There will be "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ClickOnMouseUp.json"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " and two "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ClickOnMouseUp/frame_*.json"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", with some other "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ClickOnMouseUp.*.json"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " files.\n                If you "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "git commit"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " them,\n                after running a test case you can easily find out which test cases have been affected.\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                In this test case, the unit test framework does the following thing:\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Compile the resource and run "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "gacuisrc_unittest::MainWindow"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " as the main window, offering no arguments."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Wait until the layout finishes."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Save the snapshot of the current UI to "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "frame_0.json"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Click the button."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Wait until the layout finishes."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Save the snapshot of the current UI to "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "frame_1.json"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "exit."
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                Each frame needs to make some visible UI changes,\n                the unit test framework will detect and fail if no visible UI change has been made.\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                Each frame should not call blocking functions directly.\n                For example, if a button displays a dialog,\n                the "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ShowDialog"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " or "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ShowModal"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " or "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ShowModalAndDelete"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " function only returns after the dialog is closed,\n                such functions are blocking functions.\n                In case when clicking a button displaying a dialog,\n                you should use:\n                "
              },
              {
                "kind": "Program",
                "code": "GetApplication()->InvokeInMainThread(window, [=]()\n{\n    protocol->LClick(location);\n});",
                "language": "c++"
              },
              {
                "kind": "Text",
                "text": "\n                The next frame will starts right after the dialog is shown,\n                and you can then interact with it.\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ShowModalAsync"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " does not have such limitation.\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                So the title of the frame should describe what the UI looks like before the action,\n                or just describe what the previous frame has done,\n                as a snapshot is taken combining with the title name before executing the code inside a frame.\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "Using Images",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "UnitTestFrameworkConfig::resourceFolder"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " is the working directly when compiling the GacUI XML resource.\n                If it needs to add other resource files, e.g. images, you can put them there.\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n             The following code shows how to reference image files in the resource:\n                "
              },
              {
                "kind": "Program",
                "code": "<Resource>\n  <Folder name=\"UnitTestConfig\" content=\"Link\">ListViewImagesData.xml</Folder>\n  <Folder name=\"ListViewImages\" content=\"Link\">ListViewImagesFolder.xml</Folder>\n  ...\n</Resource>",
                "language": "xml"
              },
              {
                "kind": "Text",
                "text": "\n                By saying this, "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ListViewImagesData.xml"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " and "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ListViewImagesFolder.xml"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " should be put under "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "UnitTestFrameworkConfig::resourceFolder"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ListViewImagesData.xml"
                  }
                ]
              },
              {
                "kind": "Program",
                "code": "<Folder>\n  <Xml name=\"ImageData\">\n    <ImageData>\n      <Image Path=\"ListViewImages/LargeImages/Cert\" Format=\"Png\" Width=\"32\" Height=\"32\"/>\n      ...\n    </ImageData>\n  </Xml>\n</Folder>",
                "language": "xml"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ListViewImagesFolder.xml"
                  }
                ]
              },
              {
                "kind": "Program",
                "code": "<Folder>\n  <Folder name=\"LargeImages\">\n    <Image name=\"Cert\" content=\"File\">Cert_32.png</Image>\n    ...\n  </Folder>\n  ...\n</Folder>",
                "language": "xml"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                The unit test framework will not actually read the image file,\n                but in order to perform UI layouting,\n                it will instead read "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "UnitTestConfig/ImageData"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " to search for the metadata of the image.\n                In this example,\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "res://ListViewImages/LargeImages/Cert"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " will match the record "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Format=\"Png\" Width=\"32\" Height=\"32\""
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.hrefPrefix"] = hrefPrefix;
  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
</script>
