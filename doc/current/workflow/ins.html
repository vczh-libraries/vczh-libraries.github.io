                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop a value from the stack.\n                    If it is "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "true"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", jump to the specified instruction.\n                    If it is "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "false"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", continue to execute the next instruction.\n                    If it is not a boolean value, exception occurs.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "Invoke(index, count)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> stack frame 2 (top)\narg-n\n...\narg-1\n... others"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> stack frame 1 (top)\n... local variables\narg-n\n...\narg-1\n--> stack frame 2 (top)\n... others"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Jump to the specified function, taking a specified number of stack values as arguments.\n                    Arguments are transferred to the new stack frame,\n                    so after the function ends,\n                    they are all gone.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "InvokeWithContext(index, count)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Works like "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Invoke(index, count)"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ",\n                    but the target function shares captured values of the current function.\n                    This happens when methods of the same interface implementation are calling each other,\n                    because all of these methods share the same captured values.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "InstallTry(index)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Push a new trap frame with the entry instruction to the "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "catch"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " handler.\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "UninstallTry(count)"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " must be called pairing with "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "InstallTry(index)"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "UninstallTry(count)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop the top trap frame.\n                    Keep the specified number of stack values right after this trap frame.\n                    This happens when no exception occurs while evaluating the left operand of the "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "??"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " operator,\n                    the value of the left operand becomes the value of the whole expression,\n                    which should be kept in the stack.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "RaiseException",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop an exception value and raise it. The value can be a string,\n                    a "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "WfRuntimeExceptionInfo"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", or an "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IValueException"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    When an exception occurs,\n                    all stack frames and stack values that are pushed after the top trap frame will be removed,\n                    and jump to the specified instruction of the top trap frame.\n                    If there is no trap frame,\n                    the script ends with this exception.\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "Object Creating Operations",
        "content": [
          {
            "kind": "Topic",
            "title": "NewArray(count)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nitem-1\n...\nitem-n"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\n(Ptr<IValueArray>) value of created array"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop the specified number of values from the stack,\n                    push the created array containing these values in popping order.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "NewList(count)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nitem-1\n...\nitem-n"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\n(Ptr<IValueList>) value of created list"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop the specified number of values from the stack,\n                    push the created list containing these values in popping order.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "NewObservableList(count)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nitem-1\n...\nitem-n"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\n(Ptr<IValueObservableList>) value of created observable list"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop the specified number of values from the stack,\n                    push the created observable list containing these values in popping order.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "NewDictionary(count)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue-1\nkey-1\n...\nvalue-n\nkey-n"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\n(Ptr<IValueDictionary>) value of created dictionary"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "count"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " stack values as value-key pairs and push the created dictionary.\n                    Each pair occupies two stack values, so "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "count"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " is twice the number of entries.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "CreateClosureContext(count)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nitem-n\n...\nitem-1"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\n(Ptr<WfRuntimeVariableContext>) value of created closure context"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop the specified number of values from the stack,\n                    push the created closure context containing these values in reverse popping order.\n                    If there is no value to be stored, the created context will be "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "null"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "CreateClosure",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\n(int) function\n(Ptr<WfRuntimeVariableContext>) closure context"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\n(Ptr<IValueFunctionProxy>) value of created closure"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop the index of global function and a closure context,\n                    push the created closure to the stack.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "CreateInterface(method, count)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\n(int) function-1\n(IMethodInfo*) method-1\n...\nfunction-n\nmethod-n\n(Ptr<WfRuntimeVariableContext>) closure context"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue of created interface"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "count"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " stack values as function-method pairs, then pop the closure context.\n                    Push the created interface to the stack.\n                    Each pair occupies two stack values and identifies the global function implementing a method.\n                    A null method identifies the destructor function.\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    The "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "methodParameter"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " of the instruction is the constructor of the interface.\n                    Such interface must be registered using one of the "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "BEGIN_INTERFACE_PROXY_*"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " macro.\n                    Please check out "
                  },
                  {
                    "kind": "PageLink",
                    "href": "/vlppreflection/registration-macros.html#Registration-Workflow",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Registration Workflow"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " for more details.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "CreateRange(type)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue of ending\nvalue of beginning"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\n(Ptr<IValueEnumerable>) value of created range"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop the value of ending and beginning in order,\n                    push the created range,\n                    which is a enumerable collection,\n                    including both endpoints.\n                    Each value is one greater than the previous one in this collection.\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "type"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " specifies the integer type of both endpoints.\n                    The compiler adjusts the endpoints for open ranges before executing this instruction.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "CreateStruct(flag, typeDescriptor)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue of created struct"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Create a struct of the specified type and push to the stack.\n                    All fields are filled with default values according to their types.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "DeleteRawPtr",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue to delete"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop a value from the stack and delete it.\n                    If the value is not a raw pointer,\n                    then it is just popped but not deleted.\n                    Otherwise, "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Value::DeleteRawPtr"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " is called.\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "Type Operations",
        "content": [
          {
            "kind": "Topic",
            "title": "ConvertToType(flag, typeDescriptor)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue to convert"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue of converted"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop a value from the stack and push the converted value to the stack.\n                    This instruction performs a "
                  },
                  {
                    "kind": "PageLink",
                    "href": "/workflow/lang/expr.html#Strong-casting-expression-cast-TYPE-OBJECT-cast-OBJECT",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "strong casting"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " on a value.\n                    Exception occurs if the conversion fails.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "TryConvertToType(flag, typeDescriptor)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue to convert"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue of converted"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop a value from the stack and push the converted value to the stack.\n                    This instruction attempts the same conversion as "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ConvertToType"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "null"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " will be pushed to the stack if the conversion fails.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "TestType(flag, typeDescriptor)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue to test"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\n(bool) value of testing result"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop a value from the stack and perform a "
                  },
                  {
                    "kind": "PageLink",
                    "href": "/workflow/lang/expr.html#Type-testing-expression-OBJECT-is-TYPE-OBJECT-is-not-TYPE",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "type testing"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "true"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " will be pushed to the stack if the testing succeeds.\n                    Otherwise "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "false"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "GetType",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue to test"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\n(ITypeDescriptor*) type of the value"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop a value from the stack and get its type descriptor.\n                    For "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "null"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", its type descriptor is also "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "null"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "Variant Operations",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                Each instruction pops one operand and pushes one result when it succeeds:\n                "
              },
              {
                "kind": "Program",
                "code": "before              after\n--> top             --> top\noperand             result"
              },
              {
                "kind": "Text",
                "text": "\n                A variant box stores the active option's declared "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ITypeInfo"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " and its payload.\n                These instructions implement "
              },
              {
                "kind": "PageLink",
                "href": "/workflow/lang/variant.html",
                "content": [
                  {
                    "kind": "Text",
                    "text": "variant conversions and extraction"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "VBox(typeInfo)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Wrap the operand in a variant box and push it.\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "typeInfo"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " is the declared active option type, not the complete variant type.\n                    The compiler has already checked that the operand matches this option.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "VUnbox",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop a variant box and push its active payload without checking its option type.\n                    This implements "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "variant in VALUE"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", whose result type is "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "object"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    It removes exactly one box; a null payload remains null.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "VCast(typeInfo)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop a variant box and check its active option against the target "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "typeInfo"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    If the target is a variant containing that exact option, push the existing box.\n                    Otherwise, if the target exactly matches the active option, push its payload.\n                    A mismatch raises an exception.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "VTryCast(typeInfo)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Apply the option check of "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "VCast"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", but push null on a mismatch.\n                    A nullable target "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "T?"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " also accepts an active "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "T"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " option.\n                    The compiler uses this instruction for weak casts from variants to pointer or nullable option types.\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "Reflection Operations",
        "content": [
          {
            "kind": "Topic",
            "title": "GetProperty(property)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue of the object"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue of the property"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop a value from the stack as the object,\n                    push the value of the specified property of this object.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "SetProperty(property)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue of the object\nvalue of the property"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop a value from the stack as the object,\n                    pop a value as the new value of the property\n                    update the value of the specified property of this object.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "UpdateProperty(property)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue of the property\nvalue of the object"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue of the object"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop the new property value, then pop the object and update its specified property.\n                    Unlike "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SetProperty(property)"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ",\n                    the value of the object will be pushed back to the stack after executing this instruction.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "InvokeProxy(count)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\n(Ptr<IValueFunctionProxy>) value of the function\narg-n\n...\narg-1"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue of the return value"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop the function along with a specified number of stack values as arguments from the stack,\n                    run the function with arguments,\n                    push the return value to the stack.\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    If the function is a global function or a lambda expression in the same assembly,\n                    instead of creating a new thread context,\n                    the current stack will be use to store the new stack frame for this function.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "InvokeMethod(method, count)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue of the object\narg-n\n...\narg-1"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue of the return value"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop the object along with a specified number of stack values as arguments from the stack,\n                    run the specified method on that object with arguments,\n                    push the return value to the stack.\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    If the method is implemented by another piece of Workflow script in the same assembly,\n                    instead of creating a new thread context,\n                    the current stack will be use to store the new stack frame for this function.\n                    For non-static method,\n                    the object will becomes the only captured value.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "InvokeEvent(event, count)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue of the object\narg-n\n...\narg-1"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue of the return value"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop the object along with a specified number of stack values as arguments from the stack,\n                    run the specified event on that object with arguments,\n                    push "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "null"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " as the return value to the stack.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "InvokeBaseCtor(method, count)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue of the object\narg-n\n...\narg-1"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue of the return value"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop the object along with a specified number of stack values as arguments from the stack,\n                    run the specified method on that object with arguments,\n                    push "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "null"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " as the return value to the stack.\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    This instruction is used in classes that defined using Workflow script.\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    If the base constructor is implemented by another piece of Workflow script in the same assembly,\n                    instead of creating a new thread context,\n                    the current stack will be use to store the new stack frame for this function.\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    If the base constructor is implemented by another piece of Workflow script in another assembly,\n                    the base constructor will be applied to the object directly.\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    If the base constructor is implemented by C++,\n                    aggregation will be used to bind the object and the created C++ instance.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "AttachEvent(event)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue of the function\nvalue of the object"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\n(Ptr<IEventHandler>) value of the event handler"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop the callback function and the object from the stack,\n                    attach the callback function to the specified event of the object,\n                    push the event handler to the stack.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "DetachEvent(event)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\n(Ptr<IEventHandler>) value of the event handler\nvalue of the object"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\n(bool) value of detaching result"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop the event handler and the object from the stack,\n                    detach the event handler from the specified event of the object.\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "true"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " will be pushed to the stack if the detaching succeeds.\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "Set Operations",
        "content": [
          {
            "kind": "Topic",
            "title": "TestElementInSet",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern before:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\nvalue of the set\nvalue of the element"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Stack pattern after:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "--> top\n(bool) value of testing result"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Pop the set and the value from the stack,\n                    enumerate the set and compare each item with the element using "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Value"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " equality.\n                    Push "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "true"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " if a matching item is found, otherwise "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "false"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "not in"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " negates this result with "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "OpNot(Bool)"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "Comparison Operations",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                Stack pattern before:\n                "
              },
              {
                "kind": "Program",
                "code": "--> top\nright-operand\nleft-operand"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                Stack pattern after:\n                "
              },
              {
                "kind": "Program",
                "code": "--> top\n(int or bool) value of the result"
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "CompareLiteral(type)",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Compare booleans, numbers or strings of the specified type. Null sorts before a nonnull value.\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Push "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "-1"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " to the stack if the left operand is smaller.\n                    Push "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "1"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " to the stack if the left operand is larger.\n                    Otherwise push "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "0"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", including when neither floating-point comparison succeeds because an operand is NaN.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "CompareReference",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Compare pointer identity. Operands are raw pointers, shared pointers or null.\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Push "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "true"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " to the stack if operands are equal to each other.\n                    Otherwise push "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "false"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ". Two null values are equal.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "CompareValue",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Compare two values using "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Value"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " equality.\n                    For variant operands, the compiler emits "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "VUnbox"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " first to compare their active payloads.\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Push "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "true"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " to the stack if operands are equal to each other.\n                    Push "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "false"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " to the stack if operands are not equal to each other or are unordered.\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "!="
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " negates this result with "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "OpNot(Bool)"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "CompareValueLT",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
