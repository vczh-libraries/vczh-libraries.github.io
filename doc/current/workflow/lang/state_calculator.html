            "code": "module sampleModule;\n        \nusing system::*;\n\nclass Calculator : StateMachine\n{\n    var valueFirst : string = \"\";\n    var op : string = \"\";\n    prop Value : string = \"0\" {}\n\n    func Update(value : string) : void\n    {\n        SetValue(value);\n        valueFirst = value;\n    }\n\n    func Calculate() : void\n    {\n        if (valueFirst == \"\")\n        {\n            valueFirst = Value;\n        }\n        else if (op == \"+\")\n        {\n            Update((cast double valueFirst) + (cast double Value));\n        }\n        else if (op == \"*\")\n        {\n            Update((cast double valueFirst) * (cast double Value));\n        }\n        else\n        {\n            raise $\"Unrecognized operator: $(op)\";\n        }\n    }\n\n    $state_machine\n    {\n        $state_input Digit(i : int);\n        $state_input Dot();\n        $state_input Add();\n        $state_input Mul();\n        $state_input Equal();\n        $state_input Clear();\n\n        $state Digits()\n        {\n            $switch (continue)\n            {\n            case Digit(i):\n                {\n                    Value = Value & i;\n                    $goto_state Digits();\n                }\n            }\n        }\n\n        $state Integer(newNumber: bool)\n        {\n            $switch (continue)\n            {\n            case Digit(i):\n                {\n                    if (newNumber)\n                    {\n                        Value = i;\n                    }\n                    else\n                    {\n                        Value = Value & i;\n                    }\n                    $goto_state Digits();\n                }\n            }\n        }\n\n        $state Number()\n        {\n            $push_state Integer(true);\n            $switch (continue, return)\n            {\n            case Dot():\n                {\n                    Value = Value & \".\";\n                }\n            }\n            $push_state Integer(false);\n        }\n\n        $state Operator()\n        {\n            $push_state Number();\n            $switch (raise)\n            {\n            case Add():    {Calculate(); op = \"+\";}\n            case Mul():    {Calculate(); op = \"*\";}\n            case Equal():  {Calculate();}\n            case Clear():\n                {\n                    valueFirst = \"\";\n                    op = \"\";\n                    Value = \"0\";\n                }\n            }\n            $goto_state Operator();\n        }\n    \n        $state default()\n        {\n            $goto_state Operator();\n        }\n    }\n}\n\nfunc main(): string\n{\n    var r = {\"\"};\n    var c = new Calculator^();\n    attach(c.ValueChanged, func():void\n    {\n        r[0] = $\"$(r[0])$(c.Value)\\r\\n\";\n    });\n\n    c.Digit(1); c.Digit(2); c.Add(); c.Digit(3); c.Digit(4); c.Mul(); c.Digit(5); c.Digit(6); c.Equal(); c.Clear();\n    c.Digit(2); c.Mul(); c.Equal(); c.Equal(); c.Equal(); c.Equal(); c.Clear();\n    return r[0];\n}"
