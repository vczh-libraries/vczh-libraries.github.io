  const directoryInfo = {

          "path": [

          ],
          "subNodes": [

            },
            {

              "selected": false,

};
  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "Remote Protocol Core Application",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            A remote protocol core application is a normal GacUI application that calls SetupRemoteNativeController.\n            It becomes headless and is forced into hosted mode.\n            The core does not draw to an OS native window;\n            it sends JSON remote protocol packages through a vl::inter_process channel.\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            The standard C++ path is small:\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Start a GuiRemoteProtocolNetworkChannelServer<TServerBase> over an INetworkProtocolServer implementation such as the cross-platform "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::inter_process::async_tcp_socket::SocketHttpServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", the Windows-only "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::inter_process::named_pipe::NamedPipeServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", or the Windows-only "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::inter_process::windows_http::HttpServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "."
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Connect the core to that server with GuiRemoteProtocolLocalChannelClient."
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Wrap the core channel with GuiRemoteProtocolAsyncJsonChannel and GuiRemoteProtocolCoreChannel."
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Pass the protocol, usually after GuiRemoteProtocolFilter and GuiRemoteProtocolDomDiffConverter, to SetupRemoteNativeController."
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            The portable "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "/MiniHttp"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " test path creates an "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "IAsyncSocketServer"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " with "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "CreateDefaultAsyncSocketServer(port)"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " and injects it into a "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiRemoteProtocolNetworkChannelServer<async_tcp_socket::SocketHttpServer>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " specialization.\n            The same listener can also host a separate "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "SocketHttpServerApi"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " automation prefix.\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            The core client is expected to be registered as GacUIRemoteProtocolCoreClientId.\n            A renderer created by GuiRemoteProtocolChannelClient advertises GacUIRemoteProtocolChannelName.\n            GuiRemoteProtocolCoreChannel learns the renderer client id from the renderer's ControllerConnect event,\n            so user code does not need to route individual remote protocol messages.\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            A compact named pipe setup looks like this:\n            "
          },
          {
            "kind": "Program",
            "code": "using namespace vl;\nusing namespace vl::presentation;\nusing namespace vl::presentation::remoteprotocol;\nusing namespace vl::presentation::remoteprotocol::channeling;\nusing namespace vl::presentation::remoteprotocol::repeatfiltering;\n\nclass NamedPipeRemoteCoreServer\n    : public GuiRemoteProtocolNetworkChannelServer<inter_process::named_pipe::NamedPipeServer>\n{\n    using Base = GuiRemoteProtocolNetworkChannelServer<inter_process::named_pipe::NamedPipeServer>;\n\n    EventObject rendererConnected;\n\npublic:\n    NamedPipeRemoteCoreServer(Ptr<glr::json::Parser> parser, const WString& pipeName)\n        : Base(parser, pipeName)\n    {\n        rendererConnected.CreateManualUnsignal(false);\n    }\n\n    void WaitForRenderer()\n    {\n        rendererConnected.Wait();\n    }\n\nprotected:\n    inter_process::WaitForClientResult OnClientConnected(\n        vint clientId,\n        const IJsonChannelClient::ChannelNameList& availableChannels,\n        IJsonChannelClient* localClient) override\n    {\n        if (localClient)\n        {\n            return inter_process::WaitForClientResult::Accept;\n        }\n\n        if (availableChannels.Contains(WString::Unmanaged(GacUIRemoteProtocolChannelName)))\n        {\n            rendererConnected.Signal();\n            return inter_process::WaitForClientResult::Accept;\n        }\n        return inter_process::WaitForClientResult::Reject;\n    }\n};\n\nvoid StartNamedPipeRemoteCore()\n{\n    auto jsonParser = Ptr(new glr::json::Parser);\n    NamedPipeRemoteCoreServer server(jsonParser, L\"GacUIRemoteProtocolNamedPipe\");\n    server.Start();\n\n    auto coreClient = Ptr(new GuiRemoteProtocolLocalChannelClient(jsonParser));\n    auto coreClientId = server.ConnectLocalClient(coreClient);\n    CHECK_ERROR(coreClientId == GacUIRemoteProtocolCoreClientId, L\"Failed to register the core client.\");\n\n    server.WaitForRenderer();\n\n    GuiRemoteProtocolAsyncJsonChannel asyncChannel(coreClient->GetProtocolChannel());\n    GuiRemoteProtocolCoreChannel coreProtocol(\n        coreClient.Obj(),\n        &asyncChannel,\n        L\"MyRemoteCore.exe\",\n        asyncChannel.GetRemoteEventProcessor());\n\n    GuiRemoteProtocolFilter filteredProtocol(&coreProtocol);\n    GuiRemoteProtocolDomDiffConverter diffProtocol(&filteredProtocol);\n    SetupRemoteNativeController(&diffProtocol);\n\n    server.Stop();\n}",
            "language": "c++"
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            GuiMain still creates and runs GacUI windows.\n            If the UI throws while the remote server is alive,\n            send the error through IJsonLocalChannelServer::BroadcastError so the renderer stops instead of waiting for more packages.\n            A production server can also reject clients that do not offer GacUIRemoteProtocolChannelName,\n            disconnect previous renderers, or call GuiRemoteProtocolCoreChannel::DetachRenderer when replacing a renderer.\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\n            See "
          },
          {
            "kind": "PageLink",
            "href": "https://github.com/vczh-libraries/GacUI/tree/master/Test/GacUISrc/RemotingTest_Core",
            "content": [
              {
                "kind": "Text",
                "text": "RemotingTest_Core"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "\n            for the complete named-pipe ("
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "/Pipe"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "), Windows HTTP.sys/WinHTTP ("
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "/Http"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ") and portable Mini HTTP ("
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "/MiniHttp"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ") implementations.\n        "
          }
        ]
      }
    ]
  }
};

}
