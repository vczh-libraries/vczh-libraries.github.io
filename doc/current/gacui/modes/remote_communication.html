<script lang="javascript">
{
  const mvcModel = {

    "gacui",
    "modes",
    "remote_communication"
  ]
};
  const mvcViews = [
  {
    "targetObject": "MVC-ViewContainer",
    "viewName": "Gaclib-RootView"
  },
  {
    "targetObject": "rootViewContainer",
    "viewName": "Gaclib-DirectoryView"
  },
  {
    "targetObject": "directoryViewContainer",
    "viewName": "Gaclib-ArticleView"
  }
];
  const hrefPrefix = "/doc/current";
  const directoryInfo = {
  "subNodes": [
    {
      "icon": "-",
      "name": "GacUI",
      "selected": false,
      "path": [
        "gacui",
        "home"
      ],
      "subNodes": [
        {
          "icon": "-",
          "name": "Hosted Mode and Remote Protocol",
          "selected": false,
          "path": [
            "gacui",
            "modes",
            "home"
          ],
          "subNodes": [
            {
              "icon": " ",
              "name": "Remote Protocol Core Application",
              "selected": false,
              "path": [
                "gacui",
                "modes",
                "remote_core"
              ]
            },
            {
              "icon": " ",
              "name": "Remote Protocol Client Application",
              "selected": false,
              "path": [
                "gacui",
                "modes",
                "remote_client"
              ]
            },
            {
              "icon": " ",
              "name": "Remote Protocol Channel Layer",
              "selected": true,
              "path": [
                "gacui",
                "modes",
                "remote_communication"
              ]
            }
          ]
        }
      ]
    }
  ]
};
  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "Remote Protocol Channel Layer",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\r\n            GacUI remote protocol channeling uses the vl::inter_process channel bridge and the INetworkProtocolConnection, INetworkProtocolCallback, INetworkProtocolClient and INetworkProtocolServer interfaces underneath.\r\n            The GacUI layer remains a rendering protocol between a headless core and a renderer.\r\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\r\n            The layers are:\r\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "IGuiRemoteProtocol and IGuiRemoteEventProcessor: the strongly typed GacUI remote protocol."
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiRemoteProtocolCoreChannel and GuiRemoteProtocolRendererChannel: conversion between the strongly typed protocol and JSON channel packages."
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiRemoteProtocolNetworkChannelServer, GuiRemoteProtocolLocalChannelClient and GuiRemoteProtocolChannelClient: the vl::inter_process JSON channel bridge."
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::inter_process::async_tcp_socket::NetworkProtocolServer<TAsyncSocketServer>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " and "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "NetworkProtocolClient<TAsyncSocketClient>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::inter_process::async_tcp_socket::SocketHttpServer"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " and "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SocketHttpClient"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", the Windows-only named-pipe and "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "windows_http"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " implementations, or a custom "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "INetworkProtocol"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " implementation: the underlying data-transmission mechanism."
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\r\n            The "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "INetworkProtocol"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " and "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "IChannel"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " interface families and channel bridge can be reused directly, but VlppOS provides them only for test-purpose local cross-process communication.\r\n            Product code is strongly recommended to supply its own implementation instead of treating the bundled transports and channel stack as production networking.\r\n            The GacUI JSON channel layer remains unchanged above that implementation.\r\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\r\n            The GacUI "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "/MiniHttp"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " tests create platform-default async TCP sockets and wrap them in "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "SocketHttpServer"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " and "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "SocketHttpClient"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\r\n            The core can register its remote-protocol prefix and automation prefix on the exact same "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "IAsyncSocketServer"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ", while each prefix remains independently stoppable.\r\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "PageLink",
            "href": "https://github.com/vczh-libraries/GacJS",
            "content": [
              {
                "kind": "Text",
                "text": "GacJS"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "'s primary feature is WebAssembly execution with HTML5 rendering.\r\n            Its "
          },
          {
            "kind": "Name",
            "text": "remote-protocol-wasm"
          },
          {
            "kind": "Text",
            "text": " adapter loads the GacUI core's "
          },
          {
            "kind": "Name",
            "text": "app.mjs"
          },
          {
            "kind": "Text",
            "text": " and "
          },
          {
            "kind": "Name",
            "text": "app.wasm"
          },
          {
            "kind": "Text",
            "text": "\r\n            in GacJS's "
          },
          {
            "kind": "Name",
            "text": "wasm-worker.js"
          },
          {
            "kind": "Text",
            "text": " application host.\r\n            Deploy the matching generated "
          },
          {
            "kind": "Name",
            "text": "app.worker.js"
          },
          {
            "kind": "Text",
            "text": " beside them:\r\n            Emscripten's unchanged module factory loads this separate pthread script, which imports the adjacent module.\r\n            The exposed "
          },
          {
            "kind": "Name",
            "text": "StartApplication"
          },
          {
            "kind": "Text",
            "text": " and "
          },
          {
            "kind": "Name",
            "text": "SendDataToWasmCore"
          },
          {
            "kind": "Text",
            "text": " functions and callbacks carry the existing channel packages between JavaScript and the core.\r\n            Both the HTML5 renderer and the TypeScript view-model host can use this transport, through the remote protocol and Workflow RPC channels respectively.\r\n            It is an alternative to the HTTP transport, which is used mainly to test HTML5 rendering without WebAssembly; WebAssembly channel traffic does not pass through an HTTP protocol server.\r\n            See "
          },
          {
            "kind": "PageLink",
            "href": "https://github.com/vczh-libraries/GacJS/blob/master/doc/NetworkProtocol.md",
            "content": [
              {
                "kind": "Text",
                "text": "GacJS Network Protocol"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " for the bridge contract.\r\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\r\n            The JSON channel package type is Ptr<glr::json::JsonNode>.\r\n            The remote protocol channel name is GacUIRemoteProtocolChannelName, whose value is GacUIRemoteProtocol.\r\n            The in-process core client should be assigned GacUIRemoteProtocolCoreClientId.\r\n            Renderer-side packages are sent to that core client id, and core-side packages are sent to the renderer client id learned from ControllerConnect.\r\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\r\n            ChannelPackageInfo describes the remote protocol envelope:\r\n            "
          },
          {
            "kind": "List",
            "ordered": false,
            "items": [
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "semantic: Message, Request, Response or Event."
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "id: the request or response id, or -1 when the package does not need one."
                  }
                ]
              },
              {
                "kind": "ContentListItem",
                "content": [
                  {
                    "kind": "Text",
                    "text": "name: the generated remote protocol message, request, response or event name."
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Text",
            "text": "\r\n            JsonChannelPack and JsonChannelUnpack convert this envelope and the optional arguments node to and from a JSON object.\r\n            Application code normally does not call these functions unless it is logging, debugging or building a non-C++ renderer.\r\n        "
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "What User Code Owns",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\r\n                A normal C++ application configures the remote protocol channel at startup.\r\n                After GuiRemoteProtocolCoreChannel and GuiRemoteProtocolRendererChannel are connected,\r\n                the library routes individual remote protocol messages between the strongly typed protocol and JSON channel packages.\r\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\r\n                User code usually owns only:\r\n                "
              },
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "A small server policy around GuiRemoteProtocolNetworkChannelServer, if the core needs to wait for a renderer, reject invalid clients, or replace a previous renderer."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "An underlying data-transmission implementation, represented by INetworkProtocolConnection, INetworkProtocolCallback, INetworkProtocolClient and INetworkProtocolServer."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Optional renderer-side error handling by overriding GuiRemoteProtocolChannelClient::OnReadError, OnLocalError or OnDisconnected."
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\r\n                GuiRemoteProtocolCoreChannel exposes BeforeWrite and BeforeOnRead.\r\n                GuiRemoteProtocolRendererChannel exposes the same events.\r\n                Use these events for tracing package flow or diagnosing mismatched renderer/core behavior.\r\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "Adding a Transport",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\r\n                Add a new underlying data-transmission implementation below GacUI by implementing the vl::inter_process INetworkProtocolConnection, INetworkProtocolCallback, INetworkProtocolClient and INetworkProtocolServer interfaces.\r\n                The names say network protocol, but the contract is only asynchronous WString message exchange.\r\n                The implementation can be a pipe, socket, stdio stream, shared memory, DLL function calls, a WebAssembly/JavaScript bridge, or any other mechanism that can satisfy INetworkProtocolConnection, INetworkProtocolCallback, INetworkProtocolClient and INetworkProtocolServer.\r\n                Then reuse the GacUI JSON channel classes.\r\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\r\n                The core side selects the INetworkProtocolServer implementation as the template argument:\r\n                "
              },
              {
                "kind": "Program",
                "code": "using MyRemoteCoreServer =\r\n    GuiRemoteProtocolNetworkChannelServer<MyTransportServer>;\r\n\r\nauto jsonParser = Ptr(new glr::json::Parser);\r\nMyRemoteCoreServer server(jsonParser, /* transport server constructor arguments */);\r\nserver.Start();\r\n\r\nauto coreClient = Ptr(new GuiRemoteProtocolLocalChannelClient(jsonParser));\r\nserver.ConnectLocalClient(coreClient);",
                "language": "c++"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\r\n                The renderer side wraps an INetworkProtocolClient object:\r\n                "
              },
              {
                "kind": "Program",
                "code": "auto jsonParser = Ptr(new glr::json::Parser);\r\nauto networkClient = Ptr(new MyTransportClient(/* connection arguments */));\r\n\r\nGuiRemoteProtocolChannelClient channelClient(networkClient, jsonParser);\r\nchannelClient.WaitForServer();",
                "language": "c++"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\r\n                The same channel setup shown in\r\n                "
              },
              {
                "kind": "PageLink",
                "href": "/gacui/modes/remote_core.html",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Remote Protocol Core Application"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " and\r\n                "
              },
              {
                "kind": "PageLink",
                "href": "/gacui/modes/remote_client.html",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Remote Protocol Client Application"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\r\n                works after the transport object is connected.\r\n                See "
              },
              {
                "kind": "PageLink",
                "href": "/vlppos/using-inter-process.html",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Using Inter-Process Channels"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\r\n                for the inter-process protocol and channel interface contracts.\r\n            "
              }
            ]
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.hrefPrefix"] = hrefPrefix;
  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
</script>
