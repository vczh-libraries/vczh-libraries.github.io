                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "arguments.button"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    For example, replace a subscription to "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "leftButtonDown"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " with:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "composition->GetEventReceiver()->mouseDown.AttachLambda(\n    [](GuiGraphicsComposition* sender, GuiMouseEventArgs& arguments)\n    {\n        if (arguments.button != NativeMouseButton::Left) return;\n        // Handle the left button press.\n    });",
                    "language": "c++"
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    In GacUI Resource XML, replace "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ev.leftButtonDown"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " with "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ev.mouseDown"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " and apply the same filter in Workflow:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "<Bounds>\n    <ev.mouseDown-eval><![CDATA[\n        if (arguments.button == NativeMouseButton::Left)\n        {\n            arguments.handled = true;\n        }\n    ]]></ev.mouseDown-eval>\n</Bounds>",
                    "language": "xml"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    A double click raises "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "mouseDown"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "mouseUp"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "mouseDown"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "mouseDoubleClick"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", then "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "mouseUp"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiItemMouseEventArgs"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " and "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiNodeMouseEventArgs"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " inherit "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "button"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    The existing button-specific Item events on "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiListControl"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " and Node events on "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiVirtualTreeListControl"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " are kept.\n                    Handle Mouse4 and Mouse5 through composition events.\n                "
                  }
                ]
              }
            ]

                        "text": "generator"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " describes the object that creates the current clipper, it could be "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "nullptr"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    The value of this parameter does not matter in almost all the cases,\n                    usually it is an element or a composition.\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    New methods "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IsInHostedRendering"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "StartHostedRendering"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " and "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "StopHostedRendering"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Use "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiGraphicsRenderTarget"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " to implement "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IGuiGraphicsRenderTarget"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " to reduce complexity,\n                    without bothering with dealing with hosted or non-hosted mode,\n                    and some calculation of clippings.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "IGuiGraphicsParagraph",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "OpenCaret"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " and "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "CloseCaret"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " has been replaced by "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "EnableCaret"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "DisableCaret"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " and "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "BlinkCaret"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "EnableCaret"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " and "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "DisableCaret"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " tells if the caret is activated in this specific paragraph or not.\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "BlinkCaret"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " switch the caret between visible and invisible, it should be ignored if the caret is disabled.\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "InlineObjectProperties::backgroundColor"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " is added to the struct.\n                    This field tells an additional color on the object, when its alpha channel is zero it should be ignored.\n                    In the past, the background color is set by "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SetBackgroundColor"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    Now "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SetBackgroundColor"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " as well as any other text attributes should be ignored when rendering inline objects.\n                    Currently this indicates if an object is selected or not. You can choose any way to render it.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "INativeWindow",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SetFocus"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " and "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IsFocused"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " is removed, because now activated means focused.\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    New method "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IsActivelyRefreshing"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", it always returns "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "true"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " for native platform provider.\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    New method "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GetRenderingOffset"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", it always returns "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "{0,0}"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " for native platform provider.\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    New method "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IsRenderingAsActivated"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", it should returns "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "true"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " when the window or any child window is activated.\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    New method "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SuggestMinClientSize"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", ignore it in native OS platform implementation.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "INativeWindowListener",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    The nine button-specific callbacks are removed:\n                    "
                  },
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "LeftButtonDown"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ", "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "MiddleButtonDown"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ", and "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "RightButtonDown"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " are replaced by "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "MouseDown"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "."
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "LeftButtonUp"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ", "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "MiddleButtonUp"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ", and "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "RightButtonUp"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " are replaced by "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "MouseUp"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "."
                          }
                        ]
                      },
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "LeftButtonDoubleClick"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ", "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "MiddleButtonDoubleClick"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": ", and "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "RightButtonDoubleClick"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": " are replaced by "
                          },
                          {
                            "kind": "Strong",
                            "content": [
                              {
                                "kind": "Text",
                                "text": "MouseDoubleClick"
                              }
                            ]
                          },
                          {
                            "kind": "Text",
                            "text": "."
                          }
                        ]
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    The new virtual callbacks take the button as the first parameter:\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "virtual void MouseDown(NativeMouseButton button, const NativeWindowMouseInfo& info);\nvirtual void MouseUp(NativeMouseButton button, const NativeWindowMouseInfo& info);\nvirtual void MouseDoubleClick(NativeMouseButton button, const NativeWindowMouseInfo& info);",
                    "language": "c++"
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Update listener overrides and native platform dispatch to use these callbacks for all five buttons.\n                    Move button-specific behavior into a test or switch on "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "button"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    For example, a call to "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "LeftButtonDown(info)"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " becomes "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "MouseDown(NativeMouseButton::Left, info)"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    On the second press of a double click, call "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "MouseDown"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " immediately before "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "MouseDoubleClick"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "MouseMoving"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "HorizontalWheel"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", and "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "VerticalWheel"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " still take only "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "const NativeWindowMouseInfo& info"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    All mouse callbacks receive the Super modifier in "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "info.osSuper"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    Capture this state with the native event and pass it to the listener.\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    New callback "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "RenderingAsActivated"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " and "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "RenderingAsDeactivated"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ",\n                    called when "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "INativeWindow::IsRenderingAsActivated"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " is changed.\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Closing"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " renamed to "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "BeforeClosing"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " and "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "AfterClosing"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "BeforeClosing"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " of all listeners must be called first,\n                    followed by "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "AfterClosing"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " of all listeners,\n                    if none of listeners cancel the closing in "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "BeforeClosing"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    New callback "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "NeedRefresh"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "ForceRefresh"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " and "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "BecomeNonMainHostedWindow"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ",\n                    they should not be called from a native platform provider.\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    A parameter is added to "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "DpiChanged"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "DpiChanged(true)"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " of all listeners must be called first,\n                    followed by "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "DpiChanged(false)"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " of all listeners.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "NativeMouseButton and input information",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Add "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "enum class NativeMouseButton"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " in "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "vl::presentation"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", with values\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Left"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Middle"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Right"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Mouse4"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", and "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Mouse5"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    It identifies the button passed to "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "INativeWindowListener"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " mouse-button callbacks and stored in "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiMouseEventArgs::button"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Add "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "bool osSuper = false"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " to "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "WindowMouseInfo_<T>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "NativeWindowKeyInfo"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", and "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "NativeWindowCharInfo"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    It records Win on Windows, Command on macOS, or Super on Linux.\n                    In "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "WindowMouseInfo_<T>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " it follows "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "shift"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "; in key and character information it follows "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "alt"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    Update positional aggregate initializers for the inserted field.\n                "
                  }
                ]
              },
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "WindowMouseInfo"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " and "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "NativeWindowMouseInfo"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " are aliases of "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "WindowMouseInfo_<T>"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", so both gain this field.\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiMouseEventArgs"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiKeyEventArgs"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ", and "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiCharEventArgs"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " inherit "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "osSuper"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " from their input-info base types;\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiItemMouseEventArgs"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " and "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiNodeMouseEventArgs"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " inherit it through "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiMouseEventArgs"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "INativeInputService",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "RegisterGlobalShortcutKey"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " adds a required "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "bool osSuper"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " parameter between "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "alt"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " and "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "key"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ":\n                    "
                  },
                  {
                    "kind": "Program",
                    "code": "virtual vint RegisterGlobalShortcutKey(bool ctrl, bool shift, bool alt, bool osSuper, VKEY key) = 0;",
                    "language": "c++"
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    Update implementations and callers. Pass "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "false"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " for global shortcuts without Win/Command/Super.\n                    A Windows provider maps "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "osSuper"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " to "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "MOD_WIN"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " when registering the hot key.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "INativeResourceService",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    Add the pure virtual method "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "WString GetOSSuperKeyName()"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    Implementations return "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Win"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " on Windows, "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Command"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " on macOS, and "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "Super"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " on Linux.\n                    This controls the modifier label displayed by "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GuiShortcutKeyItem::GetName()"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "IGuiPlugin",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    New parameters "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "controllerUnrelatedPlugins"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " and "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "controllerRelatedPlugins"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    is added to "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IGuiPlugin::Load"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " and "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "IGuiPlugin::Unload"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    In unit test GacUI will restart for many times,\n                    these parameters tell a plugin why it is loaded or unloaded,\n                    giving the plugin to skip some work if possible.\n                "
                  }
                ]
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "GetCurrentController and SetCurrentController",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    It is renamed to "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SetNativeController"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GetCurrentController"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": " no longer returns the object in "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "SetNativeController"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ",\n                    instead it returns a new implementation of "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "INativeController"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": "\n                    of which services could be substituted by "
                  },
                  {
                    "kind": "Strong",
                    "content": [
                      {
                        "kind": "Text",
                        "text": "GetNativeServiceSubstitution"
                      }
                    ]
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                "
                  }
                ]
              }
            ]
          },

            "content": [

                  {
                    "kind": "Text",

                    "kind": "Strong",
                    "content": [

                        "kind": "Text",
                        "text": "INativeWindowListener::HitTest"
                      }
                    ]
                  },
                  {
                    "kind": "Text",

              },
              {
                "kind": "Paragraph",
                "content": [

                    "kind": "Strong",
                    "content": [

                        "kind": "Text",

                        "kind": "Text",
                        "text": "\n                        This class is offered as a default implementation of "
