              {
                "kind": "Text",
                "text": "\n                When things inside a "

              {

                  }

                "kind": "Text",
                "text": " will search for any child composition that is a "

                  {

                    "kind": "Text",
                    "text": "GuiResponsiveCompositionBase"

                "content": [
                  {

                  }

              {

                  {

                  }

              {

                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiResponsiveCompositionBase"
                  }

      },
      {

        "title": "<ResponsiveGroup>::Direction",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                The default value for this property is "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Both"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                Valid values for this property are "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Horizontal"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Vertical"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " and "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Both"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                When "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Direction"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " is "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Horizontal"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ",\n                it only reacts to changing to its width.\n                When "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Direction"
                  }

              },
              {
                "kind": "Text",
                "text": " is "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Vertical"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ",\n                it only reacts to changing to its height.\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "<ResponsiveGroup>::LevelCount",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                This property represents how many different view it could have.\n                It is the largest "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "LevelCount"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " of all managed "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiResponsiveCompositionBase"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                If there is no managed "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiResponsiveCompositionBase"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ",\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "LevelCount"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " is 1.\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "<ResponsiveGroup>::CurrentLevel",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                This property represents the current view of a "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<ResponsiveGroup/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                The smallest view is 0,\n                the largest view is "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "LevelCount"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " - 1.\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "<ResponsiveGroup>::ViewSizes",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ViewSizes"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " is an optional integer array of preferred minimum sizes indexed by "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CurrentLevel"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                Write entries from small to large: entry 0 belongs to level 0.\n                This order is the reverse of the largest-first "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Views"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " collection of "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<ResponsiveView/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                For an array with "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "N"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " entries and current level "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "L"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", use "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ViewSizes[L]"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " when "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "L < N"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                Otherwise use "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ViewSizes[N - 1] + (L - N + 1)"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                For example, "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "{64 230}"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " selects 64, 230 and 231 at levels 0, 1 and 2.\n                Entries beyond the child-derived "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "LevelCount"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " are stored but unused; they do not create levels.\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Horizontal"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " applies the selected value to "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "PreferredMinSize.x"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " and preserves its height.\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Vertical"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " applies it to "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "PreferredMinSize.y"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " and preserves its width.\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Both"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " applies the same value to both components.\n                The group reapplies the value on assignment, level or direction changes, and minimum-size measurement.\n                Manually setting an affected component of "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "PreferredMinSize"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " does not override "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ViewSizes"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                The default empty array disables this behavior.\n                Clearing an assigned array stops further overrides and keeps the current stored "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "PreferredMinSize"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ";\n                it does not restore the value from before assignment.\n                Normal bounds measurement still applies, so children, elements and margins can require more space than the selected preference.\n                With zero margins, a nonzero level is retained at its effective minimum and lowered below that minimum;\n                growing to the next level's effective minimum admits that level.\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                Both literal XML forms below are supported without an eval binder. Child content is omitted here.\n                In C++, "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "SetViewSizes(const collections::Array<vint>&)"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " copies the array;\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GetViewSizes()"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " returns a const reference containing only the configured entries, without extrapolated values.\n                Reflection exposes an assignable typed integer-array property.\n                "
              },
              {
                "kind": "Program",
                "code": "<ResponsiveGroup Direction=\"Horizontal\" ViewSizes=\"{64 230}\">\r\n    <!-- Account rows -->\r\n</ResponsiveGroup>\r\n\r\n<ResponsiveGroup Direction=\"Horizontal\">\r\n    <att.ViewSizes><_>120</_><_>334</_></att.ViewSizes>\r\n    <!-- Movie rows -->\r\n</ResponsiveGroup>",
                "language": "XML"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                With virtualized lists, initialize newly realized responsive rows to their group's established level before attaching them.\n                Removing all rows temporarily leaves "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "LevelCount == 1"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " and "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CurrentLevel == 0"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", regardless of the array length.\n                Retain the intended level separately while reloading rows.\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ReloadVisibleStyles()"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " clears rows immediately; replacement rows can appear during the call or during later layout. Suppress nested reloads until replacement rows restore that level.\n                Restoring level zero may change the level count without raising "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CurrentLevelChanged"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ".\n                Keep the arranger's row-height reset when switching between compact and detailed templates.\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "Choosing a view",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                When a "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<ResponsiveGroup/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " is required to switch to a larger view\n                (increasing "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CurrentLevel"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " by 1),\n                or when a "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<ResponsiveGroup/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " is required to switch to a smaller view\n                (decreasing "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CurrentLevel"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " by 1),\n                it tells all managed "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "GuiResponsiveCompositionBase"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " to synchronize with that new "
              },
              {
                "kind": "Strong",
                "content": [
