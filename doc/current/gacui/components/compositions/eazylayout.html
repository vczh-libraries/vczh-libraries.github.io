  const hrefPrefix = "/doc/current";
  const directoryInfo = {
  "subNodes": [

      "path": [

      "subNodes": [

          "path": [

          "subNodes": [
            {

              "path": [

              "subNodes": [

                  "selected": false,

                {

                  "selected": true,

                {

                  "selected": false,

                    "gacui",

                  ]
                },
                {
                  "icon": " ",
                  "name": "<Flow> and <Flow>",
                  "selected": false,
                  "path": [
                    "gacui",
                    "components",
                    "compositions",

                  ]
                },
                {
                  "icon": " ",
                  "name": "<Table>, <Cell>, <RowSplitter> and <ColumnSplitter>",
                  "selected": false,
                  "path": [
                    "gacui",

                  ]
                },
                {
                  "icon": "+",
                  "name": "Repeat Compositions",
                  "selected": false,
                  "path": [
                    "gacui",

                  ]

                {

                  "selected": false,
                  "path": [

                {

                  "selected": false,

                  "selected": false,

                {

                  "selected": false,

                    "gacui",

                  ]
                },
                {
                  "icon": " ",
                  "name": "Handling Input Events",
                  "selected": false,
                  "path": [

                    "events"
                  ]
                }
              ]
            }
          ]
        }
      ]
    }
  ]
};
  const article = {
  "index": true,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "<ez:Layout>",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "<ez:Layout/>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " is a bounds composition that arranges controls using docking,\n            proportional space, and grids. The "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "ez"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " namespace is predefined in GacUI XML resources.\n            Its child layout descriptions are not controls or compositions.\n        "
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "Arranging Content",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                Use "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<ez:Top/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " and "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<ez:Bottom/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " for vertical docking,\n                or "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<ez:Left/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " and "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<ez:Right/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " for horizontal docking.\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<ez:Fill/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " shares the remaining space using its "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Percentage"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " weight, which defaults to 1.\n                For a group containing only fills, "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Direction=\"Horizontal\""
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " or "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Direction=\"Vertical\""
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                selects the arrangement; otherwise it inherits the enclosing arrangement, defaulting to horizontal at the root.\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                For grids, put "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<ez:Column/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " descriptions inside "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<ez:Row/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", or rows inside columns.\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CellOption"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " selects minimum, absolute, or proportional sizing, and "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CellSpan"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " spans tracks.\n                Place an empty "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<ez:Splitter/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " between tracks to let users resize adjacent absolute-sized tracks.\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                Each layout or description can contain one control or independently positioned composition,\n                or a group of child descriptions.\n                Do not mix horizontal and vertical docking at the same level, or fills with rows or columns.\n                Nest groups to combine these arrangements.\n                For example, a vertical layout can contain a horizontal button group:\n                "
              },
              {
                "kind": "Program",
                "code": "<ez:Layout>\n  <ez:Fill><MultilineTextBox/></ez:Fill>\n  <ez:Bottom>\n    <ez:Right><Button Text=\"OK\"/></ez:Right>\n    <ez:Right><Button Text=\"Cancel\"/></ez:Right>\n  </ez:Bottom>\n</ez:Layout>",
                "language": "XML"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                Nesting "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<ez:Layout/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " is supported but strongly discouraged for combining arrangements.\n                Use nested description groups within one owning layout instead;\n                different groups can have different arrangements without an extra layout owner.\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                Declare controls, compositions and layout descriptions as direct children.\n                The named "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Composition"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " and "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Layouts"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " properties are unsupported in resource XML,\n                including attributes, property elements and bindings.\n                Their C++ and Workflow APIs remain available for programmatic changes.\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "Spacing",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Padding"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " sets the gap between neighboring parts and defaults to 5.\n                Nested description groups do not multiply that gap.\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Border"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " defaults to "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "true"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " and adds the same gap around the layout;\n                set it to "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "false"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " to remove that outside gap. It does not draw a border.\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "Responsive Layout Tutorial",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "PageLink",
                "href": "https://github.com/vczh-libraries/Release/tree/master/Tutorial/GacUI_Layout/Responsive3",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Responsive3"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                combines docking and grid descriptions with responsive account and movie lists.\n                The window uses "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<ez:Layout/>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " to arrange the lists and dialog buttons;\n                separate responsive views own their layouts and item templates.\n                See "
              },
              {
                "kind": "PageLink",
                "href": "/gacui/components/compositions/responsive.html",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Responsive Design Series"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                for the view transitions and source files.\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "Updating the Layout",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                XML resources build the layout automatically after assignments, initial bindings and event handlers are ready.\n                Nested layouts build before their owners, and "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "ref.Ctor"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " observes the built layouts.\n                Normal resizing needs no extra work.\n                Call "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "BuildLayout()"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " after changing layout descriptions or their properties.\n                Rebuilding keeps existing controls, their state, bindings, and event handlers.\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Padding"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Border"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Direction"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CellSpan"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Percentage"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ", and "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CellOption"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": "\n                support ordinary well-typed expressions and bindings.\n                "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "CellOption"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " uses the same struct expressions as table options,\n                including runtime field expressions and default values for omitted fields.\n                Initial bindings affect the automatic build; later changes take effect only when "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "BuildLayout()"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " is called.\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                Layout grammar, conflicting options and invalid numeric values fail during the automatic initialization build\n                or a later explicit "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "BuildLayout()"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": ". Ownership checks can fail during assignment.\n                Multiple control/composition payloads in the same default content fail XML compilation.\n                Later programmatic content replacement remains supported, as do bindings on the configuration properties described above.\n                Ordinary XML syntax, type and binder restrictions are also checked at compilation.\n            "
              }
            ]
          }
        ]
      }
    ]
  }
};
  window["MVC-Resources.mvcModel"] = mvcModel;
  window["MVC-Resources.mvcViews"] = mvcViews;
  window["MVC-Resources.hrefPrefix"] = hrefPrefix;
  window["MVC-Resources.directoryInfo"] = directoryInfo;
  window["MVC-Resources.article"] = article;
  for (const view of mvcViews) {
    window[view.viewName].renderView(mvcModel, document.getElementById(view.targetObject));
  }
  const renderedScriptTags = document.getElementById("MVC-ViewContainer").getElementsByTagName("script");
  for (const scriptTag of renderedScriptTags) {
    eval(
      "(function(){" + scriptTag.innerHTML + "})()"
    );
  }
}
</script>
