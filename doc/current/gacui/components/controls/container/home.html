          {

            "text": "\r\n            Unlike compositions that only layout multiple other objects in groups,\r\n            container controls offer more features in user interaction.\r\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "<GroupBox/>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " is the simplest container composition\r\n            which displays its "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "Text"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " with its content.\r\n            Controls serving a same purpose could be grouped\r\n            in a "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",

            "content": [
              {
                "kind": "Text",
                "text": "<ScrollContainer/>"
              }
            ]

            "kind": "Text",
            "text": " is a container with built-in scroll bars.\r\n            When the size of the container is too small to display all its content,\r\n            scroll bars will be enabled or shown.\r\n        "
          }
        ]
      },
      {
        "kind": "Paragraph",
        "content": [

            "kind": "Text",
            "text": "\r\n            Scroll bars are provided in "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "GuiScrollView"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ",\r\n            which is the base class of "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "<ScrollContainer/>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": "\r\n            and also all other list controls and some editor controls.\r\n            "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "HorizontalAlwaysVisible"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " and "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "VerticalAlwaysVisible"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " properties\r\n            also exist in list controls and some editor controls,\r\n            so that their scroll bars can be optionally hidden\r\n            when list items are not too many.\r\n        "
          }
        ]
      },

        "kind": "Paragraph",
        "content": [

            "kind": "Strong",
            "content": [

                "kind": "Text",
                "text": "<Tab/>"

            "kind": "Text",
            "text": " and "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "<VTab/>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " show one "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "<TabPage/>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": " at a time.\r\n            The built-in skins place the headers above the page for "

            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "<Tab/>"
              }
            ]

            "kind": "Text",
            "text": " and to its left for "
          },
          {
            "kind": "Strong",
            "content": [
              {
                "kind": "Text",
                "text": "<VTab/>"
              }
            ]
          },
          {
            "kind": "Text",
            "text": ".\r\n            Pages that have been shown contribute to the minimum size even while another page is selected.\r\n        "
          }
        ]
      }

  }
