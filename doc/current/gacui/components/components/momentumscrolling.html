};
  const article = {
  "index": false,
  "numberBeforeTitle": false,
  "topic": {
    "kind": "Topic",
    "title": "MomentumScrolling",
    "content": [
      {
        "kind": "Paragraph",
        "content": [
          {
            "kind": "Name",
            "text": "vl::presentation::compositions::MomentumScrolling"
          },
          {
            "kind": "Text",
            "text": " is an optional "
          },
          {
            "kind": "Name",
            "text": "GuiComponent"
          },
          {
            "kind": "Text",
            "text": " that continues a single-contact scrolling gesture after successful release. Ordinary scroll views do not enable momentum automatically. The component runs on the UI thread and emits the existing scrolling payload; it needs no renderer-specific messages."
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "Ownership and attachment",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "Create the component with the parameterless constructor returning "
              },
              {
                "kind": "Name",
                "text": "MomentumScrolling*"
              },
              {
                "kind": "Text",
                "text": ", then transfer ownership to one root with "
              },
              {
                "kind": "Name",
                "text": "GuiInstanceRootObject::AddComponent"
              },
              {
                "kind": "Text",
                "text": ". Call "
              },
              {
                "kind": "Name",
                "text": "AttachControl"
              },
              {
                "kind": "Text",
                "text": " for each target. Attachments do not own controls, and duplicate attachment is a no-op. Each control has independent sampling and playback state."
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Name",
                "text": "DetachControl"
              },
              {
                "kind": "Text",
                "text": " stops that control and removes its listeners; detaching an unattached control is a no-op. Component detachment or destruction stops all targets. Disposed controls are retired without accessing destroyed receivers. A fresh Started, cancellation, an extra contact or a graphics-host change prevents stale continuation."
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "Set "
              },
              {
                "kind": "Name",
                "text": "AcceptPointEvents"
              },
              {
                "kind": "Text",
                "text": " explicitly on non-scroll views when default acceptance is wanted. Attachment does not change that property. "
              },
              {
                "kind": "Name",
                "text": "GuiScrollView"
              },
              {
                "kind": "Text",
                "text": " and derived controls already default it to true. Subscribe at the persistent "
              },
              {
                "kind": "Name",
                "text": "BoundsComposition"
              },
              {
                "kind": "Text",
                "text": ": "
              },
              {
                "kind": "Name",
                "text": "GetPointEventComposition()"
              },
              {
                "kind": "Text",
                "text": " queries active capture and returns null while idle or after End. An accepting child remains the sole owner of its sequence."
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "Selection and movement",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "Momentum preserves selected list items and document ranges while scrolling the viewport. Scrollable document content accepts touch in ViewOnly, Selectable and Editable modes, so a drag can initiate momentum without changing the range. The label family supports press selection but has no built-in gesture scrolling."
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "Stationary short/long presses start no momentum. A fresh Started stops existing continuation before any later press-selection action. See "
              },
              {
                "kind": "PageLink",
                "href": "/gacui/components/controls/editor/home.html#touch",
                "content": [
                  {
                    "kind": "Text",
                    "text": "document touch selection"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " for caret and range rules."
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "The component selects scrolling offers without marking them handled. Normal controls and application handlers consume movement. Generated events start unhandled, target both source fields at the bounds and do not contribute to velocity sampling. Existing axis locking, enabled/visible scrollbar checks and range clamping still apply."
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "Deceleration",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Name",
                "text": "Deceleration"
              },
              {
                "kind": "Text",
                "text": " is a finite positive double, initially "
              },
              {
                "kind": "Name",
                "text": "2.0"
              },
              {
                "kind": "Text",
                "text": ". Velocity is the signed average over the final quarter second, or the shorter sequence duration, including final-Up movement and stationary time through End. Playback captures the current setting and decelerates at "
              },
              {
                "kind": "Name",
                "text": "320 * Deceleration"
              },
              {
                "kind": "Text",
                "text": " logical pixels per second squared."
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "Scrolling 160 logical pixels at constant speed over 0.5 seconds and releasing immediately yields 320 pixels per second. At the default setting, continuation stops after 0.5 seconds and adds 80 logical pixels before clamping. An explicit value of 1.0 stops in one second; 0.5 stops in two seconds. Resting for at least a quarter second before End leaves zero release velocity. Increments are integrated at 0.1-second elapsed boundaries plus the final partial interval, carrying fractional distance. Delayed timer callbacks catch up using elapsed time."
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "XML example",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "This root owns one component. The initially unchecked checkbox attaches or detaches its scroll container."
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Program",
                "code": "<Instance ref.Class=\"demo::MomentumWindow\">\n  <ref.Members><![CDATA[\n    var momentum: MomentumScrolling* = new MomentumScrolling*();\n  ]]></ref.Members>\n  <ref.Ctor><![CDATA[{ self.AddComponent(momentum); }]]></ref.Ctor>\n  <Window ref.Name=\"self\" Text=\"Momentum\" ClientSize=\"x:480 y:320\">\n    <ez:Layout>\n      <ez:Top>\n        <CheckBox ref.Name=\"enabled\" Text=\"Momentum Scrolling\" Selected=\"false\">\n          <ev.SelectedChanged-eval><![CDATA[{\n            if (enabled.Selected) { self.momentum.AttachControl(view); }\n            else { self.momentum.DetachControl(view); }\n          }]]></ev.SelectedChanged-eval>\n        </CheckBox>\n      </ez:Top>\n      <ez:Fill>\n        <ScrollContainer ref.Name=\"view\">\n          <Label Text=\"Scrollable content\">\n            <att.BoundsComposition-set PreferredMinSize=\"x:600 y:1200\"/>\n          </Label>\n        </ScrollContainer>\n      </ez:Fill>\n    </ez:Layout>\n  </Window>\n</Instance>",
                "language": "XML"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "See the "
              },
              {
                "kind": "PageLink",
                "href": "https://github.com/vczh-libraries/Release/tree/master/Tutorial/GacUI_Windows/TouchingList",
                "content": [
                  {
                    "kind": "Text",
                    "text": "TouchingList tutorial"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " for list selection and horizontal swipe deletion alongside optional vertical momentum."
              }
            ]
          }
        ]
      }
    ]
  }
};
