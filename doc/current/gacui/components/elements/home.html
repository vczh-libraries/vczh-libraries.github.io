                        "href": "/gacui/xmlres/instance/properties.html#Structs",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "struct"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ".\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Thickness"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " defines the width of the text."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Text"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " defines the content of the text."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "HorizontalAlignment"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " defines the horizontal alignment of the text. The value could be "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Center"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Left"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", or "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Right"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ". The default value is "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Left"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "VerticalAlignment"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " defines the vertical alignment of the text. The value could be "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Center"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Top"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", or "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Bottom"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ". The default value is "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Bottom"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "WrapLine"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " defaults to "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "false"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ". When it is "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "true"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", the element wraps the text to multiple line if it exceeds the expected width."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Ellipse"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " defaults to "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "false"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ". When it is "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "true"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", the element renders out-of-bound text to "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "..."
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " line if it exceeds the expected width."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Multiline"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " defaults to "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "false"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ". When it is "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "true"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", the element interpret "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "\\n"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " as a line break."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "WrapLineHeightCalculation"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " defaults to "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "false"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ".\n                        When it is "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "false"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", the minimum size of the element does not consider "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "WrapLine"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ".\n                        When it is "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "true"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", the minimum height of the element depends on the expected width, and the minimum width is the expected width.\n                    "
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "<ImageFrame>",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<ImageFrame>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " renders an image.\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Image"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " defines the source of an image.\n                        It could be binded to image properties of a control or a control template.\n                        The "
                      },
                      {
                        "kind": "PageLink",
                        "href": "/gacui/xmlres/instance/properties.html#-uri",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "-uri"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " binding could be used to specify an image from the resource.\n                    "
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "FrameIndex"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " defaults to 0. It specified the target frame in the image to render. All image contains only one frame except "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "gif"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "HorizontalAlignment"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " defines the horizontal alignment of the text. The value could be "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Center"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Left"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", or "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Right"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ". The default value is "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Left"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "VerticalAlignment"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " defines the vertical alignment of the text. The value could be "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Center"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Top"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", or "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Bottom"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ". The default value is "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Bottom"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": "."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Stretch"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " defaults to "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "false"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ". When it is "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "true"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", image fills the expected size instead of keeping its original size. And the minimum size of this element becomes 0."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Enabled"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " defaults to "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "true"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ". When it is "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "false"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ", the element renders a gray-scaled image. Typically this is used on icons of toolstrip buttons."
                      }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "<Polygon>",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "<Polygon>"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " renders a polygon with a border color and a filling color.\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "List",
                "ordered": false,
                "items": [
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "BorderColor"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " defaults to "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "#00000000"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ". It defines the color of the border."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "BackgroundColor"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " defaults to "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "#00000000"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ". It defines the color of the shape."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Size"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " defines the size of the polygon. It also becomes the minimum size of this element."
                      }
                    ]
                  },
                  {
                    "kind": "ContentListItem",
                    "content": [
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "Points"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": " is an array of "
                      },
                      {
                        "kind": "Strong",
                        "content": [
                          {
                            "kind": "Text",
                            "text": "presentation::Point"
                          }
                        ]
                      },
                      {
                        "kind": "Text",
                        "text": ". It defines all vertices of the polygon in order.\n                    "
                      }
                    ]
                  }
                ]
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                The "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Size"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " property creates a coordinate space for "
              },
              {
                "kind": "Strong",
                "content": [
                  {
                    "kind": "Text",
                    "text": "Points"
                  }
                ]
              },
              {
                "kind": "Text",
                "text": " with (0,0) in the top-left corner.\n                When the size of the element is larger than the minimum size,\n                the coordinate space is aligned to the center.\n            "
              }
            ]
          }
        ]
      },
      {
        "kind": "Topic",
        "title": "<Raw>: owner drawing",
        "content": [
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Name",
                "text": "<Raw/>"
              },
              {
                "kind": "Text",
                "text": " is the standard, recommended way to implement owner drawing in GacUI,\n                both in native applications and through the remote protocol.\n                It places application-defined drawing inside a composition while keeping layout and input handling in GacUI.\n                TUI does not support "
              },
              {
                "kind": "Name",
                "text": "<Raw/>"
              },
              {
                "kind": "Text",
                "text": ".\n            "
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Text",
                "text": "\n                Place one "
              },
              {
                "kind": "Name",
                "text": "<Raw/>"
              },
              {
                "kind": "Text",
                "text": " inside the composition that owns the drawing area.\n                Its optional string properties are "
              },
              {
                "kind": "Name",
                "text": "Id"
              },
              {
                "kind": "Text",
                "text": " and "
              },
              {
                "kind": "Name",
                "text": "Data"
              },
              {
                "kind": "Text",
                "text": "; both default to an empty string.\n                "
              },
              {
                "kind": "Name",
                "text": "ref.Name"
              },
              {
                "kind": "Text",
                "text": " exposes the element to generated code as "
              },
              {
                "kind": "Name",
                "text": "GuiRawElementBase"
              },
              {
                "kind": "Text",
                "text": ".\n                The element has no intrinsic minimum size, so set a size on the composition when needed.\n                For example, this fragment can appear inside an instance's composition tree:\n                "
              },
              {
                "kind": "Program",
                "code": "<Bounds PreferredMinSize=\"x:240 y:240\">\n  <Raw ref.Name=\"clock\" Id=\"Example.Clock\" Data=\"10:20:30\"/>\n</Bounds>",
                "language": "xml"
              }
            ]
          },
          {
            "kind": "Paragraph",
            "content": [
              {
                "kind": "Name",
                "text": "Id"
              },
              {
                "kind": "Text",
                "text": " selects the application's drawing convention; it is not a unique element key.\n                Empty and duplicate IDs are valid, so track drawing attachments by element identity.\n                "
              },
              {
                "kind": "Name",
                "text": "Data"
              },
              {
                "kind": "Text",
                "text": " carries application-defined state, such as the clock's "
              },
              {
                "kind": "Name",
                "text": "HH:mm:ss"
              },
              {
                "kind": "Text",
                "text": " string.\n                Changing "
              },
              {
                "kind": "Name",
                "text": "Data"
              },
              {
                "kind": "Text",
                "text": " requests a repaint. Changing "
              },
              {
                "kind": "Name",
                "text": "Id"
              },
              {
                "kind": "Text",
                "text": " alone does not request one,\n                and equal assignments do nothing. With the remote protocol, an ID-only change is sent on the next frame.\n            "
              }
            ]
          },
          {
            "kind": "Topic",
            "title": "Native rendering APIs",
            "content": [
              {
                "kind": "Paragraph",
                "content": [
                  {
                    "kind": "Text",
                    "text": "\n                    The active graphics resource manager chooses the concrete element for "
                  },
                  {
                    "kind": "Name",
                    "text": "<Raw/>"
                  },
                  {
                    "kind": "Text",
                    "text": ".\n                    All four native implementations derive from "
                  },
                  {
                    "kind": "Name",
                    "text": "GuiRawElementBase"
                  },
                  {
                    "kind": "Text",
                    "text": " and expose a C++ "
                  },
                  {
                    "kind": "Name",
                    "text": "Rendering"
                  },
                  {
                    "kind": "Text",
                    "text": " event:\n                    "
                  },
                  {
                    "kind": "List",
                    "ordered": false,
                    "items": [
                      {
                        "kind": "ContentListItem",
                        "content": [
                          {
                            "kind": "Name",
                            "text": "GuiDirect2DElement"
                          },
                          {
                            "kind": "Text",
                            "text": " on Windows provides "
                          },
                          {
                            "kind": "Name",
                            "text": "GuiDirect2DElementEventArgs"
                          },
                          {
                            "kind": "Text",
                            "text": " with "
                          },
                          {
                            "kind": "Name",
                            "text": "element"
                          },
                          {
                            "kind": "Text",
                            "text": ", "
                          },
                          {
                            "kind": "Name",
                            "text": "rt"
                          },
                          {
                            "kind": "Text",
                            "text": " ("
                          },
                          {
                            "kind": "Name",
                            "text": "ID2D1RenderTarget*"
                          },
                          {
                            "kind": "Text",
                            "text": "), Direct2D/DirectWrite factories and "
                          },
                          {
                            "kind": "Name",
                            "text": "bounds"
                          },
                          {
                            "kind": "Text",
                            "text": ". Release target-bound resources in "
                          },
                          {
                            "kind": "Name",
                            "text": "BeforeRenderTargetChanged"
                          },
                          {
                            "kind": "Text",
                            "text": " and recreate them for the new target in "
                          },
                          {

                    "kind": "Text",
                    "text": "\n                    Attach handlers to the concrete native element after creating the UI, and keep them attached through its drawing lifetime.\n                    Draw within the supplied bounds using the current clip and coordinate transform.\n                    Borrow drawing contexts only for the callback; do not retain or destroy them, start another frame, or present the target.\n                    In particular, Wayland and Cocoa contexts may change between paint calls.\n                    Detach handlers before destroying their owning drawing objects.\n                "

                    "text": ".\n                    The receiving renderer draws locally; native pointers, drawing callbacks and rendered pixels are not transferred.\n                    Install a matching drawing implementation in each renderer that the application supports.\n                "

                    "kind": "Text",
                    "text": "\n                    The native "

                    "text": "GetRawElements()"

                    "kind": "Text",
                    "text": " and\n                    "
                  },
                  {
                    "kind": "Name",
                    "text": "RawElementInstalled"
                  },
                  {
                    "kind": "Text",
                    "text": ", "
                  },
                  {
                    "kind": "Name",
                    "text": "RawElementUninstalled"
                  },
                  {
                    "kind": "Text",
                    "text": " and "

                  {
                    "kind": "Name",
                    "text": "RawElementChanged"
                  },

                    "kind": "Text",
                    "text": ".\n                    Subscribe before processing messages and enumerate existing elements for late attachment.\n                    An installed element initially has empty state; select or replace its drawing attachment when its ID changes.\n                    Changed callbacks see both updated descriptor fields, including data-only changes.\n                    Uninstallation is the point to remove attachments; a temporarily hidden element or retained disconnected picture may still exist.\n                "
